set timeout=4
set default=0
set gfxmode=text

menuentry "Minimal Desktop 1.0.0" {
    multiboot2 /boot/kernel.elf
    module2 /boot/store.img store-repository
    boot
}

menuentry "Minimal Desktop (automated self-test, --autotest)" {
    multiboot2 /boot/kernel.elf --autotest
    module2 /boot/store.img store-repository
    boot
}

menuentry "Minimal Desktop (safe text mode)" {
    multiboot2 /boot/kernel.elf --safe --nologin
    module2 /boot/store.img store-repository
    boot
}

menuentry "Minimal Desktop (login prompt)" {
    multiboot2 /boot/kernel.elf
    module2 /boot/store.img store-repository
    boot
}
